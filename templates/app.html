<div class="app-shell">
  <header class="topbar">
    <a class="brand" href="#/overview" aria-label="IPAware Console home">
      <span class="brand-mark"><svg class="icon"><use href="#i-shield"></use></svg></span>
      <span class="brand-text"><strong>{{APP_NAME}}</strong><small>IP intelligence console</small></span>
    </a>

    <div class="topbar-search">
      <label class="search-field">
        <svg class="icon"><use href="#i-search"></use></svg>
        <input id="global-search" type="search" placeholder="Search IPs, CIDRs, reasons, fields…" autocomplete="off" spellcheck="false" aria-label="Global IP search">
        <kbd>/</kbd>
      </label>
    </div>

    <div class="topbar-actions">
      <span id="connection-pill" class="pill pill--muted"><span class="dot"></span>Connecting</span>
      <button id="palette-trigger" class="btn btn--ghost btn--sm hide-sm" type="button" title="Search commands and actions (Ctrl+K)">
        <svg class="icon"><use href="#i-command"></use></svg><span>Commands</span><kbd>⌘K</kbd>
      </button>
      <button id="theme-toggle" class="icon-btn" type="button" title="Toggle light / dark theme" aria-label="Toggle theme"><svg class="icon"><use href="#i-sun"></use></svg></button>
      <span class="access-chip" id="access-chip" title="Only allowlisted public IPs can reach this console">
        <svg class="icon"><use href="#i-shield"></use></svg><span id="client-ip">—</span>
      </span>
    </div>
  </header>

  <div class="workspace">
    <nav class="sidebar" aria-label="Primary navigation">
      <div class="sidebar-label">Console</div>
      <div class="tablist" id="tablist" role="tablist" aria-orientation="vertical">
        <button class="tab" role="tab" data-route="overview" aria-selected="true" type="button"><svg class="icon"><use href="#i-grid"></use></svg><span>Overview</span></button>
        <button class="tab" role="tab" data-route="decisions" aria-selected="false" type="button"><svg class="icon"><use href="#i-ban"></use></svg><span>Blocked IPs</span><em class="tab-badge" id="badge-decisions">—</em></button>
        <button class="tab" role="tab" data-route="allowlist" aria-selected="false" type="button"><svg class="icon"><use href="#i-check-circle"></use></svg><span>Whitelist</span><em class="tab-badge" id="badge-allowlist">—</em></button>
        <button class="tab" role="tab" data-route="lookup" aria-selected="false" type="button"><svg class="icon"><use href="#i-search"></use></svg><span>IP lookup</span></button>
        <button class="tab" role="tab" data-route="events" aria-selected="false" type="button"><svg class="icon"><use href="#i-activity"></use></svg><span>Live events</span><em class="tab-badge tab-badge--live" id="badge-events">—</em></button>
        <button class="tab" role="tab" data-route="commands" aria-selected="false" type="button"><svg class="icon"><use href="#i-terminal"></use></svg><span>Commands</span></button>
        <button class="tab" role="tab" data-route="settings" aria-selected="false" type="button"><svg class="icon"><use href="#i-settings"></use></svg><span>Settings</span></button>
      </div>
      <div class="sidebar-foot">
        <div class="live-row"><span id="live-dot" class="dot"></span><span id="live-label">Live stream offline</span></div>
        <div class="muted tiny">v{{VERSION}} · PHP 8.2</div>
      </div>
    </nav>

    <main class="main">
      <div class="toolbar">
        <div class="toolbar-left">
          <h1 id="page-title">Overview</h1>
          <p id="page-subtitle" class="muted">Loading console…</p>
        </div>
        <div class="toolbar-right">
          <label class="select-wrap" title="Automatically re-read the lists">
            <svg class="icon"><use href="#i-refresh"></use></svg>
            <select id="auto-refresh" aria-label="Auto-refresh interval">
              <option value="0">Auto-refresh off</option>
              <option value="15">Every 15 s</option>
              <option value="30" selected>Every 30 s</option>
              <option value="60">Every 60 s</option>
              <option value="300">Every 5 min</option>
            </select>
          </label>
          <label class="switch" title="Server-Sent Events push updates">
            <input type="checkbox" id="live-toggle" checked><span>Live</span>
          </label>
          <button id="refresh-now" class="btn btn--primary btn--sm" type="button"><svg class="icon"><use href="#i-refresh"></use></svg><span>Refresh</span></button>
          <div class="dropdown" id="export-dropdown">
            <button id="export-trigger" class="btn btn--sm" type="button" aria-haspopup="true" aria-expanded="false"><svg class="icon"><use href="#i-download"></use></svg><span>Export</span><svg class="icon icon--xs"><use href="#i-chevron-down"></use></svg></button>
            <div class="dropdown-menu" id="export-menu" hidden>
              <button type="button" data-export="xlsx" data-type="all"><svg class="icon"><use href="#i-file"></use></svg><span><strong>Excel workbook (.xlsx)</strong><small>All IPs, blocked, whitelist + summary</small></span></button>
              <button type="button" data-export="xlsx" data-type="blocked"><svg class="icon"><use href="#i-ban"></use></svg><span><strong>Excel (.xlsx)</strong><small>Blocked IPs only</small></span></button>
              <button type="button" data-export="xlsx" data-type="allowed"><svg class="icon"><use href="#i-check-circle"></use></svg><span><strong>Excel (.xlsx)</strong><small>Whitelist only</small></span></button>
              <div class="dropdown-sep"></div>
              <button type="button" data-export="csv" data-type="all"><svg class="icon"><use href="#i-download"></use></svg><span><strong>CSV (Excel compatible)</strong><small>Current search filter applied</small></span></button>
            </div>
          </div>
        </div>
      </div>

      <div class="status-strip" id="status-strip">
        <span id="last-updated"><svg class="icon icon--xs"><use href="#i-clock"></use></svg> Not loaded yet</span>
        <span id="status-message" class="status-message"></span>
        <span id="row-count" class="status-count"></span>
      </div>

      <div id="view" class="view" role="tabpanel" aria-live="polite">
        <div class="skeleton-card"><div class="skeleton-line w40"></div><div class="skeleton-line"></div><div class="skeleton-line w70"></div></div>
      </div>

      <footer class="footer">
        <span>{{APP_NAME}} v{{VERSION}} · © {{YEAR}}</span>
        <span class="muted">Single-page console · lazy loaded tabs · SSE events · Excel export</span>
      </footer>
    </main>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
<div id="modal-root"></div>
<div id="palette-root"></div>

<noscript><div class="noscript">This console needs JavaScript. Enable it and reload the page.</div></noscript>
<script type="module" src="asset.php?f=js/app.js"></script>
</body>
</html>
